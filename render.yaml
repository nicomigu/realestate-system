# Render Blueprint: free-tier API (with the worker in-process, ADR 0004) and Key Value.
# Postgres lives on Supabase (free). When Render asks for DATABASE_URL during
# Blueprint creation, paste Supabase's *Session pooler* connection string: the
# direct connection is IPv6-only, and Render can't reach IPv6 addresses.
services:
  - type: web
    name: realestate-api
    runtime: node
    plan: free
    region: singapore # nearest Render region to the Supabase project (Asia Pacific)
    # `corepack pnpm` runs the pnpm version pinned in package.json without
    # `corepack enable`, which fails because /usr/bin is read-only on Render.
    # "api..." builds the API and the workspace packages it depends on (packages/shared), in order.
    buildCommand: corepack pnpm install --frozen-lockfile && corepack pnpm --filter "api..." build
    # Migrations run before the app starts: Prisma 8 doesn't apply them from app code.
    startCommand: corepack pnpm --filter api db:migrate && corepack pnpm --filter api start:prod
    healthCheckPath: /health
    autoDeployTrigger: checksPass
    buildFilter:
      paths:
        - apps/api/**
        - packages/shared/**
        - pnpm-lock.yaml
        - render.yaml
    envVars:
      - key: NODE_VERSION
        value: "24"
      # Corepack ships with Node 24; this stops it asking before it downloads pnpm.
      - key: COREPACK_ENABLE_DOWNLOAD_PROMPT
        value: "0"
      - key: NODE_ENV
        value: production
      - key: LOG_LEVEL
        value: info
      - key: DATABASE_URL
        sync: false
      - key: WEB_ORIGIN
        value: https://realestate-system-ashen.vercel.app
      # Signs chat tokens; Render generates a random value once.
      - key: CHAT_TOKEN_SECRET
        generateValue: true
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: realestate-redis
          property: connectionString

  - type: keyvalue
    name: realestate-redis
    plan: free
    region: singapore
    # BullMQ requires that Redis never evicts its keys.
    maxmemoryPolicy: noeviction
    # Reachable only from services inside this Render account.
    ipAllowList: []
