name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: realestate
          POSTGRES_PASSWORD: realestate
          POSTGRES_DB: realestate_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U realestate"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://realestate:realestate@localhost:5432/realestate_test
      TEST_REDIS_URL: redis://localhost:6379/1
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        working-directory: .
      - name: Build packages/shared
        run: pnpm --filter @realestate-system/shared build
        working-directory: .
      - run: pnpm lint
      - run: pnpm typecheck
      - name: Contract matches the committed artifacts
        run: pnpm contract:check
      - run: pnpm test
      # The e2e global setup applies migrations to the test database first.
      - run: pnpm test:e2e
      - run: pnpm build

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        working-directory: .
      - name: Build packages/shared
        run: pnpm --filter @realestate-system/shared build
        working-directory: .
      - run: pnpm lint
      - run: pnpm build
