# Render's free web service sleeps after 15 idle minutes, and delayed jobs can't fire
# while it sleeps (ADR 0004). Pinging /health keeps it awake. Set the repository
# variable API_URL (e.g. https://realestate-api.onrender.com) to turn this on.
name: Keep API awake

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    if: vars.API_URL != ''
    runs-on: ubuntu-latest
    steps:
      - run: curl --fail --silent --show-error --max-time 90 "${{ vars.API_URL }}/health"
